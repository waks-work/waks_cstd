name: waks_cstd_ci

on: 
  push:
      branches: [main, dev]
  pull_request:
      branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with: 
            version: 0.13.0

      - name: Build Systems (C/C++)
        run: zig build --summary all
          
      - name: Run Tests
        run: zig build test
